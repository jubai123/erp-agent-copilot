services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot_dev
      POSTGRES_DB: erp_copilot
    ports:
      # Loopback-only: nothing outside the host should query the database
      # directly; containers reach it over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d erp_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only: Redis has no auth in this stack; keep it off the NIC.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Application services (one image, command distinguishes the process) ---
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: erp-agent-copilot:latest
    command: ["uvicorn", "apps.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app_env
      APP_NAME: erp-agent-copilot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://copilot:copilot_dev@postgres:5432/erp_copilot
      REDIS_URL: redis://redis:6379/0
      # api_key = production default (fail-closed: every request needs a valid
      # X-API-Key and identity derives from the key). header trusts
      # X-Tenant-ID/X-User-ID and is dev-only — opt in explicitly with
      # AUTH_MODE=header. api_key mode also requires a non-empty
      # API_KEY_PEPPER (config.py fails fast if it's missing).
      AUTH_MODE: ${AUTH_MODE:-api_key}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      # Empty by default => setup_tracing falls back to the non-blocking console
      # exporter. Opt in to a remote collector, e.g. a host OTel Collector with
      # OTEL_EXPORTER_ENDPOINT=http://host.docker.internal:4317.
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: erp-agent-copilot:latest
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      # Merge the shared app env, then pin the prometheus multiprocess dir for
      # THIS service only — the API container must NOT see it, or its own
      # in-process /metrics would silently switch to the (empty) mmap registry.
      <<: *app_env
      PROMETHEUS_MULTIPROC_DIR: /prometheus_metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback-only: the worker's /metrics scrape endpoint carries no auth;
      # Prometheus reaches it over the compose network regardless.
      - "127.0.0.1:8003:8003"
    tmpfs:
      # In-memory dir where forked children write per-pid metric files; wiped
      # on restart so values from dead processes never persist. The image runs
      # as USER app (uid/gid 1000); without an explicit owner, a `docker restart`
      # re-mounts the tmpfs root-owned and the worker can't create counter files.
      - /prometheus_metrics:uid=1000,gid=1000,mode=0750
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  erp_simulator:
    build:
      context: ..
      dockerfile: Dockerfile
    image: erp-agent-copilot:latest
    command: ["uvicorn", "apps.erp_simulator.simulator:create_simulator_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_NAME: erp-agent-copilot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Settings() requires DATABASE_URL even though the simulator is stateless.
      DATABASE_URL: postgresql://copilot:copilot_dev@postgres:5432/erp_copilot
      # Empty disables the inbound token gate (open test double); set a secret
      # to fail-close every non-/health route (see session 33).
      SIMULATOR_SHARED_SECRET: ${SIMULATOR_SHARED_SECRET:-}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mcp_gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: erp-agent-copilot:latest
    command: ["uvicorn", "apps.mcp_gateway.gateway:create_gateway_app", "--factory", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      APP_NAME: erp-agent-copilot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://copilot:copilot_dev@postgres:5432/erp_copilot
      REDIS_URL: redis://redis:6379/0
      # Egress guard is fail-closed: empty => no outbound MCP connections.
      # Set per topology, e.g. trusted_internal_hosts for an http erp_simulator.
      MCP_EGRESS_ALLOWED_HOSTS: ${MCP_EGRESS_ALLOWED_HOSTS:-}
      MCP_EGRESS_TRUSTED_INTERNAL_HOSTS: ${MCP_EGRESS_TRUSTED_INTERNAL_HOSTS:-}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Observability stack (docs/08): scrapes /metrics, no auth required -----
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      # Loopback-only: reach the UI via SSH tunnel, never from the public NIC.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - mcp_gateway
      - erp_simulator
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      # Loopback-only: reach the UI via SSH tunnel, never from the public NIC.
      - "127.0.0.1:3000:3000"
    environment:
      # Fail closed: no default password. `:?` aborts `docker compose up` with
      # a clear message unless GRAFANA_ADMIN_PASSWORD is set in the environment.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # provisioning/ is scanned at boot; dashboards/ is polled for file changes.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
