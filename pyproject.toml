[project]
name = "erp-agent-copilot"
version = "0.1.0"
description = "ERP Agent Copilot V6 - AI-powered ERP automation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "mcp>=1.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "jieba>=0.42",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.8",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_copilot", "apps"]

[tool.hatch.build.targets.wheel.force-include]
"src/erp_copilot/py.typed" = "erp_copilot/py.typed"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "agent-copilot-v5-20260317",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["erp_copilot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
explicit_package_bases = true
mypy_path = ["src", "."]

# Third-party packages that ship no stubs and expose no py.typed marker.
# jieba: no community stub package exists; yaml: types-PyYAML not vendored.
[[tool.mypy.overrides]]
module = ["jieba", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["agent-copilot-v5-20260317"]

[dependency-groups]
dev = [
    "locust>=2.46.3",
]
