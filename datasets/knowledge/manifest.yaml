# Unified Fact Table — single source of truth for the ERP Simulator's world state.
#
# Every domain entity, enumeration, and business constraint used by the
# simulator, knowledge base (L1/L2), and evaluation datasets MUST be defined
# here.  No other file is authoritative for field names, enum values, or
# business rules.
#
# When the simulator seed data changes, update this file first, then propagate
# to knowledge documents and eval datasets.

