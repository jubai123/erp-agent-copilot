# ---------------------------------------------------------------------------
# Scenarios (4 modes — see apps/erp_simulator/scenarios.py)
# ---------------------------------------------------------------------------
scenarios:
  - name: happy_path
    description: "All endpoints behave normally — products in stock, suppliers available, orders succeed."
    affected_endpoints:
      - GET /products/{name}
      - GET /products/{id}/stock
      - GET /suppliers
      - POST /orders
      - GET /orders/{order_id}

  - name: stock_insufficient
    description: "Product stock is reported as 0.  Orders fail with 422 when requested quantity > 0."
    affected_endpoints:
      - GET /products/{id}/stock
      - POST /orders

  - name: supplier_unavailable
    description: "All suppliers report status UNAVAILABLE regardless of seed data."
    affected_endpoints:
      - GET /suppliers

  - name: timeout
    description: "Order creation returns 504 Gateway Timeout.  Used to test retry / idempotency behavior."
    affected_endpoints:
      - POST /orders

# ---------------------------------------------------------------------------
# Order model (see apps/erp_simulator/data/orders.py)
# ---------------------------------------------------------------------------
order_fields:
  - name: order_id
    type: string
    required: true
    description: "12-char hex string, server-generated."

  - name: product_id
    type: integer
    required: true
    description: "Foreign key into the product catalog."

  - name: product_name
    type: string
    required: true
    description: "Denormalised product name at order time."

  - name: quantity
    type: integer
    required: true
    description: "Must be > 0 and ≤ available stock."

  - name: supplier_id
    type: integer
    required: true
    description: "Foreign key into the supplier catalog."

  - name: region
    type: string
    required: true
    constraint: "must be in supplier_region_enum"

  - name: amount
    type: float
    required: true
    description: "unit_price × quantity, computed server-side."

  - name: status
    type: string
    required: true
    description: "Current position in the order lifecycle."

  - name: idempotency_key
    type: string
    required: true
    description: "Client-generated unique key; duplicate submissions return the cached result."

  - name: created_at
    type: string
    required: true
    description: "ISO-8601 timestamp in UTC."

order_status_lifecycle:
  initial: CREATED
  terminal:
    - DELIVERED
    - CANCELLED
  transitions:
    CREATED:
      - CONFIRMED
      - CANCELLED
    CONFIRMED:
      - SHIPPED
      - CANCELLED
    SHIPPED:
      - DELIVERED
      - CANCELLED
    DELIVERED: []
    CANCELLED: []

# ---------------------------------------------------------------------------
# Business constraints
# ---------------------------------------------------------------------------
business_constraints:
  idempotency:
    mechanism: "idempotency_key hash → cached response"
    scope: "per-client (key uniqueness enforced at server level)"
    behaviour: "First request → 201, duplicate key → 200 with cached result"
  stock_validation:
    rule: "Order quantity must be ≤ product.quantity_in_stock at order time."
    on_failure: "HTTP 422 with detail message"
    scenario_override: "stock_insufficient scenario reports effective stock as 0 regardless of seed data."
