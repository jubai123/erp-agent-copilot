# Intent → Rule mapping table.
#
# Maps (domain, action) pairs to a deterministic list of L1 rule IDs.
# The rule_matcher uses this table for O(1) lookups — no vector search.
#
# When adding a new intent, ensure:
#  1. The intent key is unique.
#  2. All referenced rule_ids exist in rules.yaml.
#  3. Rules that are safety-critical (approval, idempotency, stock-check)
#     are included for every relevant write intent.

intents:
  - domain: product
    action: query
    rules:
      - product-unit-constraint
      - product-fields

  - domain: product
    action: check_stock
    rules:
      - product-fields
      - scenario-awareness

  - domain: product
    action: add
    rules:
      - product-fields
      - product-unit-constraint
      - approval-policy

  - domain: product
    action: update
    rules:
      - product-fields
      - approval-policy

  - domain: product
    action: delete
    rules:
      - product-fields
      - approval-policy
      - data-security-policy

  - domain: supplier
    action: query
    rules:
      - region-enum-constraint
      - supplier-status-constraint
      - supplier-fields

  - domain: supplier
    action: create
    rules:
      - supplier-fields
      - region-enum-constraint
      - supplier-status-constraint
      - approval-policy

  - domain: supplier
    action: delete
    rules:
      - supplier-fields
      - approval-policy
      - data-security-policy

  - domain: order
    action: create
    rules:
      - order-param-constraints
      - stock-check-rule
      - supplier-availability-rule
      - idempotency-rule
      - approval-policy
      - scenario-awareness
      - price-calculation-rule

  - domain: order
    action: query
    rules:
      - order-state-machine
      - order-param-constraints

  - domain: order
    action: query_by_time
    rules:
      - order-param-constraints
      - order-state-machine

  - domain: order
    action: query_by_status
    rules:
      - order-param-constraints
      - order-state-machine

  - domain: order
    action: query_by_product
    rules:
      - order-param-constraints
      - order-state-machine

  - domain: order
    action: query_by_supplier
    rules:
      - order-param-constraints
      - order-state-machine

  - domain: order
    action: cancel
    rules:
      - order-state-machine
      - order-cancel-constraint
      - approval-policy
      - idempotency-rule

  - domain: order
    action: update_status
    rules:
      - order-state-machine
      - approval-policy

  - domain: order
    action: modify
    rules:
      - order-modify-constraint
      - order-state-machine
      - approval-policy

  - domain: security
    action: data_access
    rules:
      - data-security-policy

  - domain: system
    action: scenario
    rules:
      - scenario-awareness
