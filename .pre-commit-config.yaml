repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^agent-copilot-v5-20260317/
      - id: end-of-file-fixer
        exclude: ^agent-copilot-v5-20260317/
      - id: check-yaml
        exclude: ^agent-copilot-v5-20260317/
      - id: check-toml
        exclude: ^agent-copilot-v5-20260317/
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
